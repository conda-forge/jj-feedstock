context:
  version: "0.43.0"

package:
  name: jj
  version: ${{ version }}

source:
  url: https://github.com/jj-vcs/jj/archive/v${{ version }}.tar.gz
  sha256: 5d230327737ee506b716c6ae5ac824c49951c34e117a024dc7aa38819809ea6c

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - pkg-config
  host:
    - openssl
    - zlib

tests:
  - script:
      - jj --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Git-compatible distributed version control system
  homepage: https://github.com/jj-vcs/jj
  repository: https://github.com/jj-vcs/jj

extra:
  recipe-maintainers:
    - danielnachun
